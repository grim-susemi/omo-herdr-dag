name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
            artifact: npm-package-node-24
          - os: ubuntu-latest
            node: '26'
            artifact: npm-package-node-26
          - os: windows-latest
            node: '24'
            artifact: npm-package-windows-node-24
          - os: windows-latest
            node: '26'
            artifact: npm-package-windows-node-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the Windows ConPTY adapter
        if: runner.os == 'Windows'
        run: npm rebuild node-pty --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Pack release artifact
        run: |
          mkdir -p .artifacts
          npm pack --ignore-scripts --pack-destination .artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
